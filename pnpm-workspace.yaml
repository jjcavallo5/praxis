packages:
  - apps/*
  - packages/*
  - tooling/*

catalog:
  react: ^19.2.0
  react-dom: ^19.2.0
  typescript: ^6.0.2
  zod: ^4.3.6
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
  vitest: ^5.0.5
  "@vitest/coverage-v8": ^5.0.5
  "@types/react": ^19.2.0
  "@types/react-dom": ^19.2.0

onlyBuiltDependencies:
  - esbuild
  - lightningcss

overrides:
  vite@*: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
